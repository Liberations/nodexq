plugins { id 'com.android.application' }

android {
    namespace 'com.tyl.xiangqi.ndxq'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tyl.xiangqi.nodechess_test'
        minSdk 23
        targetSdk 35
        versionCode 58
        versionName '20.5'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    signingConfigs {
        release {
            storeFile file('../minilink.keystore')
            storePassword 'minilink'
            keyAlias 'minilink'
            keyPassword 'minilink'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
}



dependencies {
    implementation files("${buildDir}/native-libs/native-libs.jar")
    // sherpa-onnx 离线语音识别（Apache-2.0）：本地 AAR，abiFilters 只保留 arm64-v8a。
    // AAR 内的类是 Kotlin 编写，运行时需要 kotlin-stdlib（工程本身仍是纯 Java）。
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
